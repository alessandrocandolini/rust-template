name: Template CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: # enable manual execution

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-template:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy --component llvm-tools-preview
          rustup default stable

      - name: Install cargo-generate
        run: cargo install cargo-generate --version 0.23.9 --locked

      - name: Generate a sample project
        working-directory: ${{ runner.temp }}
        run: cargo generate --path "$GITHUB_WORKSPACE" --name template-smoke-test --vcs none --no-workspace

      - name: Check generated layout
        working-directory: ${{ runner.temp }}/template-smoke-test
        run: |
          test -f .github/workflows/rust.yml
          test ! -e .github/workflows/ci.yml
          test ! -e .github/workflows/rust.yml.liquid
          test ! -e cargo-generate.toml
          test -f README.md
          test ! -e README.md.liquid
          IFS= read -r heading < README.md
          test "$heading" = "# template-smoke-test"

      - name: Cache generated project dependencies and build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ runner.temp }}/template-smoke-test -> target

      - name: Install act
        run: |
          curl --fail --location --silent --show-error \
            https://github.com/nektos/act/releases/latest/download/act_Linux_x86_64.tar.gz \
            --output "$RUNNER_TEMP/act.tar.gz"
          tar -xzf "$RUNNER_TEMP/act.tar.gz" -C "$RUNNER_TEMP" act
          "$RUNNER_TEMP/act" --version

      - name: Validate generated workflow with act
        working-directory: ${{ runner.temp }}/template-smoke-test
        run: '"$RUNNER_TEMP/act" -n -W .github/workflows/rust.yml -P ubuntu-latest=catthehacker/ubuntu:act-24.04'

      - name: Lint template and generated workflows
        uses: raven-actions/actionlint@v2
        with:
          files: .github/workflows/ci.yml, ${{ runner.temp }}/template-smoke-test/.github/workflows/rust.yml

      - name: Check generated formatting
        working-directory: ${{ runner.temp }}/template-smoke-test
        run: cargo fmt --all -- --check

      - name: Clippy
        working-directory: ${{ runner.temp }}/template-smoke-test
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Unit, integration, property and documentation tests
        working-directory: ${{ runner.temp }}/template-smoke-test
        run: cargo test --all-features

      - name: Build generated executable
        working-directory: ${{ runner.temp }}/template-smoke-test
        run: cargo build --release

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      - name: Generate coverage for the sample project
        working-directory: ${{ runner.temp }}/template-smoke-test
        run: |
          cargo llvm-cov --all-features --lcov --output-path lcov.info
          test -s lcov.info
